name: DiegoMusic
options:
  minimumXcodeGenVersion: "2.46.0"
  xcodeVersion: "14.3"
  projectFormat: xcode14_0
  bundleIdPrefix: com.diegocainzos
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DiegoMusic:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "13.0"
    sources:
      - path: DiegoMusic
        excludes:
          - "**/*.md"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: DiegoMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Proyecto educativo privado"
        YOUTUBE_DATA_KEY: $(YOUTUBE_DATA_KEY)
        AUDIO_RESOLVER_BASE_URL: $(AUDIO_RESOLVER_BASE_URL)
        AUDIO_RESOLVER_API_TOKEN: $(AUDIO_RESOLVER_API_TOKEN)
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_NAME: DiegoMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.diegocainzos.DiegoMusic
        DEVELOPMENT_TEAM: B28C46A6QX
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MACCATALYST: false
        ENABLE_HARDENED_RUNTIME: true
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/DiegoMusic.entitlements
    scheme:
      gatherCoverageData: true
      testTargets:
        - DiegoMusicTests
  DiegoMusicTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "13.0"
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: DiegoMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegocainzos.DiegoMusicTests
        GENERATE_INFOPLIST_FILE: true
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/DiegoMusic.app/Contents/MacOS/DiegoMusic"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
        "TEST_HOST[sdk=iphone*]": "$(BUILT_PRODUCTS_DIR)/DiegoMusic.app/DiegoMusic"
        "BUNDLE_LOADER[sdk=iphone*]": "$(TEST_HOST)"
