name: diegomusic-resolver

services:
  resolver:
    build:
      context: ..
      dockerfile: ResolverService/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: "https://${RESOLVER_DOMAIN:?Define RESOLVER_DOMAIN en ResolverService/.env}"
      AUDIO_CACHE_DIR: /var/cache/diegomusic
      AUDIO_CACHE_MAX_BYTES: "${AUDIO_CACHE_MAX_BYTES:-5368709120}"
      AUDIO_CACHE_MAX_FILE_BYTES: "${AUDIO_CACHE_MAX_FILE_BYTES:-268435456}"
      RESOLUTION_CACHE_MAX_ENTRIES: "${RESOLUTION_CACHE_MAX_ENTRIES:-500}"
      RESOLUTION_CACHE_TTL_SECONDS: "${RESOLUTION_CACHE_TTL_SECONDS:-10800}"
      RESOLUTION_CACHE_SAFETY_MARGIN_SECONDS: "${RESOLUTION_CACHE_SAFETY_MARGIN_SECONDS:-300}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////service/data/diegomusic.db}"
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.diegomusic.rule=Host(`${RESOLVER_DOMAIN:-music.diegocainzos.cv}`) && (PathPrefix(`/v1`) || PathPrefix(`/api`) || PathPrefix(`/health`))
      - traefik.http.routers.diegomusic.priority=100
      - traefik.http.routers.diegomusic.entrypoints=websecure
      - traefik.http.routers.diegomusic.tls.certresolver=letsencrypt
      - traefik.http.services.diegomusic.loadbalancer.server.port=8080
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - audio_cache:/var/cache/diegomusic
      - db_data:/service/data

networks:
  proxy:
    external: true

volumes:
  audio_cache:
  db_data:
