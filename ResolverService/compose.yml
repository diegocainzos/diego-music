name: diegomusic-resolver

services:
  resolver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: "https://${RESOLVER_DOMAIN:?Define RESOLVER_DOMAIN en ResolverService/.env}"
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      resolver:
        condition: service_healthy
    environment:
      RESOLVER_DOMAIN: "${RESOLVER_DOMAIN:?Define RESOLVER_DOMAIN en ResolverService/.env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
