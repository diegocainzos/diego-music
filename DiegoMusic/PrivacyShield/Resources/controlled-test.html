<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font: 16px system-ui; background: #f2e7d5; color: #171512; padding: 24px; }
    .panel { border: 3px solid #171512; padding: 16px; box-shadow: 8px 8px 0 #e34b3f; }
    .ok { color: #177245; } .blocked { color: #b5221f; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Laboratorio PrivacyShield</h1>
    <p id="allowed">Recurso permitido: pendiente</p>
    <p id="blocked">Recurso publicitario: pendiente</p>
  </main>
  <script>
    const test = (id, url, blockedExpected) => {
      const image = new Image();
      image.onload = () => {
        document.getElementById(id).textContent = blockedExpected
          ? "Recurso publicitario: NO bloqueado"
          : "Recurso permitido: cargado";
        document.getElementById(id).className = blockedExpected ? "blocked" : "ok";
      };
      image.onerror = () => {
        document.getElementById(id).textContent = blockedExpected
          ? "Recurso publicitario: bloqueado"
          : "Recurso permitido: error de red";
        document.getElementById(id).className = blockedExpected ? "ok" : "blocked";
      };
      image.src = url;
    };
    test("allowed", "allowed-test.svg?slot=diegomusic-content-test", false);
    test("blocked", "blocked-ad-test.svg?slot=diegomusic-ad-test", true);
  </script>
</body>
</html>
