<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    :root { color-scheme: dark; background: #171512; }
    * { box-sizing: border-box; }
    html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171512; }
    body::after { content: "DIEGO MUSIC"; position: fixed; right: 8px; bottom: 6px; z-index: 2; color: #f3d34a; font: 700 9px/1 system-ui; letter-spacing: .15em; pointer-events: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (() => {
      "use strict";
      let player = null;
      let pendingVideoID = null;
      let progressTimer = null;

      const post = payload => {
        const handler = window.webkit?.messageHandlers?.playerBridge;
        if (handler) handler.postMessage(payload);
      };

      const api = document.createElement("script");
      api.src = "https://www.youtube.com/iframe_api";
      api.async = true;
      document.head.appendChild(api);

      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player("player", {
          width: "100%",
          height: "100%",
          playerVars: {
            autoplay: 0,
            controls: 0,
            playsinline: 1,
            enablejsapi: 1,
            origin: "__APP_ORIGIN__",
            widget_referrer: "__APP_ORIGIN__",
            rel: 0
          },
          events: {
            onReady: () => {
              post({ type: "ready" });
              if (pendingVideoID) {
                player.cueVideoById(pendingVideoID);
                pendingVideoID = null;
              }
            },
            onStateChange: event => post({ type: "state", state: event.data }),
            onError: event => post({ type: "error", code: event.data })
          }
        });

        progressTimer = window.setInterval(() => {
          if (!player || typeof player.getCurrentTime !== "function") return;
          post({
            type: "progress",
            currentTime: Number(player.getCurrentTime()) || 0,
            duration: Number(player.getDuration()) || 0
          });
        }, 750);
      };

      window.DieMusicPlayer = {
        receive(command) {
          if (!command || typeof command.type !== "string") return;
          if (command.type === "load" && typeof command.videoID === "string") {
            if (player?.cueVideoById) player.cueVideoById(command.videoID);
            else pendingVideoID = command.videoID;
          } else if (command.type === "play") {
            player?.playVideo?.();
          } else if (command.type === "pause") {
            player?.pauseVideo?.();
          } else if (command.type === "seek" && Number.isFinite(command.seconds)) {
            player?.seekTo?.(command.seconds, true);
          }
        }
      };

      window.addEventListener("beforeunload", () => {
        if (progressTimer) window.clearInterval(progressTimer);
      });
    })();
  </script>
</body>
</html>
