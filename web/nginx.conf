server {
    listen 80;
    root /usr/share/nginx/html;
    access_log off;

    # APK publicado con scripts/publish-apk.sh (carpeta montada en solo lectura).
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    # Enlace antiguo documentado en el README.
    location = /diegomusic.apk {
        return 301 /downloads/diegomusic.apk;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
